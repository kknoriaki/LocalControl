/div><div class="panel-body">'+btn('Отправить Mute keybind','discord-key','mic')+'<p class="note-text" style="margin-top:12px">Состояние Discord неизвестно. Прототип имитирует отправку разрешённой комбинации.</p></div></section></aside></div>'}
function remote(){return heading('remote','Экран ПК и управление — только с отдельным разрешением.',btn('Обновить снимок','refresh','restart'))+'<div class="two-column"><div><section class="panel"><div class="panel-title"><h2>Monitor 1</h2><span class="small muted">2560 × 1440 · демонстрация</span></div><div class="remote-screen" id="remote-screen" role="button" tabindex="0" aria-label="Демонстрационный экран: указать точку"><span class="remote-label">ПРЕДПРОСМОТР · НЕ ЖИВОЙ ЭКРАН</span><div class="remote-wall"><div class="remote-tree">LOCALCONTROL<br>▸ src<br>　Core<br>　Windows<br>　Server<br>　Desktop<br>▸ docs</div><div class="remote-code"><span style="color:#929ca2">// A quieter way to control your PC</span><br><b>LocalControl</b><br>Desktop → LAN → iPhone<br><br>Audio sessions &nbsp; <b>ready</b><br>Connection &nbsp; <b>paired</b><br>Transport &nbsp; <b>local</b></div></div><div class="remote-dock"><span></span><span></span><span></span><span></span><span></span></div></div><div class="remote-tools">'+btn('Снимок','refresh','screen')+btn('Клавиатура','keyboard','keyboard')+btn('На весь экран','fullscreen','remote')+'<span class="remote-status" id="remote-status">Снимок · демо</span></div></section><div class="mobile-only"><div class="touchpad" id="touchpad">'+icon('remote')+' &nbsp; Тачпад · демонстрация</div><div class="row">'+btn('Левый клик','remote-click','','','data-id="left"')+btn('Правый клик','remote-click','','','data-id="right"')+btn('Прокрутка','remote-click','','','data-id="scroll"')+'</div></div><div class="keyboard-line"><input class="field" id="remote-input" placeholder="Ввести текст на ПК · демо" aria-label="Текст для удалённой клавиатуры">'+btn('Отправить','send-keys','keyboard')+'</div><p class="note-text" style="margin-top:13px">Remote 1.0: снимки экрана и базовый ввод. Потоковое видео — следующий этап.</p></div><aside><section class="panel"><div class="panel-title"><h2>Разрешения</h2>'+icon('shield')+'</div><div class="panel-body"><div class="r ва','navigate','devices','','data-id="devices"')+'</div></div></section><div class="notice" style="margin-top:18px">LocalControl работает независимо от LocalCloud. Доступ из интернета для core-функций не требуется.</div></aside></div>'}

function transferRows(){return state.queue.map(f=>'<div class="app-row">'+icon('file')+'<div class="grow"><h3>'+escape(f.name)+'</h3><p>'+(f.status==='complete'?'Передано · симуляция':f.status==='cancelled'?'Отменено · симуляция':f.progress+'% · симуляция')+' · '+(f.size/1024/1024).toFixed(1)+' MB</p><div class="progress"><div style="width:'+f.progress+'%"></div></div></div>'+ (f.status==='uploading'?btn('Отмена','cancel-file','close','','data-id="'+f.id+'"'):f.status==='cancelled'?btn('Повторить','retry-file','restart','','data-id="'+f.id+'"'):icon('check'))+'</div>').join('')||'<div class="empty">Очередь пуста</div>'}
function transfers(){return heading('transfers','Быстро отправить файл. Без второй библиотеки.')+'<div class="two-column"><div><section class="panel"><div class="panel-title"><h2>На компьютер</h2><span class="small muted">Демо-очередь</span></div><div class="panel-body"><div class="transfer-zone">'+icon('upload')+'<h3>Фото, видео или любой файл</h3><p>В прототипе используются только имя и размер. Данные никуда не отправляются.</p>'+btn('Выбрать файлы','files','plus','primary')+'<input id="file-input" type="file" multiple hidden></div></div><div id="transfer-list">'+transferRows()+'</div></section><section class="panel"><div class="panel-title"><h2>Буфер обмена</h2><span class="small muted">Только по действию</span></div><div class="panel-body"><textarea class="field" id="clipboard" placeholder="Текст или ссылка · демо" aria-label="Текст для буфера обмена" rows="3"></textarea><div class="row wrap" style="margin-top:12px">'+btn('Отправить на ПК','clipboard','transfer')+btn('Получить с ПК','clipboard-read','file')+'</div></div></section></div><aside><section class="panel"><div class="panel-title"><h2>На телефон</h2></div><div class="panel-body"><p class="note-text">На ПК выбирается файл и создаётся временная очередь для paired телефона.</p><div style="margin-top:18px">'+btn('Посмотреть пример','send-phone','devices')+'</div></div></section></aside></div>'}
function more(){return heading('more','Система и подключение')+'<section class="panel">'+[['transfers','transfer'],['startup','startup'],['hardware','chip'],['devices','devices'],['settings','settings']].map(([id,ico])=>'<button class="setting-row" style="width:100%;text-align:left" data-action="navigate" data-id="'+id+'"><span class="row">'+icon(ico)+'<span>'+titles[id]+'</span></span>'+icon('chevron')+'</button>').join('')+'</section><h3 class="section-title">Питание</h3>'+power()}
function setTheme(){let actual=state.theme;if(!['dark','light','system'].includes(actual))actual=state.theme='dark';if(actual==='system')actual=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=actual;document.querySelector('meta[name=theme-color]').content=actual==='dark'?'#0e0f11':'#f2f3f4';try{localStorage.setItem('lc-prototype-theme',state.theme)}catch{}}

function pairRequest(){dialog('<div class="caption" style="margin-bottom:14px">ЗАПРОС НА ПК · ДЕМО</div><h2>Подключить iPhone?</h2><p>Сверь код на экране ПК и телефона.</p><div class="pair-code">482 193</div><p>iPhone Ильи · Safari<br>Домашняя сеть · 192.168.1.31</p><div class="line"></div><label><input type="checkbox" id="perm-audio" checked> Аудио и микрофон</label><label><input type="checkbox" id="perm-apps" checked> Запуск приложений</label><label><input type="checkbox" id="perm-power"> Управление питанием</label><label><input type="checkbox" id="perm-remote"> Remote: просмотр и ввод</label><div class="dialog-actions">'+btn('Отклонить','close-modal')+btn('Подтвердить · демо','pair-approve','','primary')+'</div>')}
let pendingPower='';
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action,id=target.dataset.id;
 if(action==='navigate')navigate(id);
 else if(action==='theme'){state.theme=id;render()}
 else if(action==='theme-cycle'){state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';render();toast('Тема: '+state.theme)}
 else if(action==='mic'){state.mic=!state.mic;render();toast(state.mic?'Микрофон Windows выключен · демо':'Микрофон Windows включён · демо')}
 else if(action==='play'){state.playing=!state.playing;render();toast('Воспроизведение · демо')}
 else if(action==='next'||action==='previous'){state.mediaIndex=(state.mediaIndex+(action==='next'?1:media.length-1))%media.length;render()}
 else if(action==='filter'){state.filter=id;render()}
 else if(action==='favorite'){const a=state.apps.find(a=>a.id===id);a.favorite=!a.favorite;render()}
 else if(action==='launch'){const a=state.apps.find(a=>a.id===id);const running=a.running;a.running=true;render();toast(a.name+': '+(running?'открыто':'запущено')+' · симуляция')}
 else if(action==='app'){const a=state.apps.find(a=>a.id===id);a.running=!a.running;render();toast(a.name+': '+(a.running?'запущено':'закрыто')+' · симуляция')}
 else if(action==='mute'){const a=id==='system'?state.sounds:state.apps.find(a=>a.id===id);a.muted=!a.muted;render();toast(a.name+': '+(a.muted?'звук выключен':'звук включён')+' · демо')}
 else if(action==='power'){pendingPower=id;dialog('<h2>'+({lock:'Заблокировать ПК?',sleep:'Перевести ПК в сон?',restart:'Перезапустить ПК?',shutdown:'Выключить ПК?'}[id])+'</h2><p>Демонстрация подтверждения. Это действие сейчас не затронет твой компьютер.</p><div class="dialog-actions">'+btn('Отмена','close-modal')+btn('Подтвердить · демо','power-confirm','','primary')+'</div>')}
 else if(action==='power-confirm'){closeDialog();toast('Действие «'+pendingPower+'» подтверждено · симуляция')}
 else if(action==='pair')pair();else if(action==='pair-request')pairRequest();else if(action==='pair-approve'){const permissions=[['perm-audio','Аудио'],['perm-apps','Приложения'],['perm-power','Питание'],['perm-remote','Remote']].filter(([id])=>document.getElementById(id).checked).map(([,label])=>label);state.devices.push({id:Date.now(),name:'Новый iPhone',browser:'Safari · iOS',permissions,connected:true});closeDialog();render();toast('Устройство подтверждено · симуляция')}
 else if(action==='revoke'){state.devices=state.devices.filter(d=>String(d.id)!==id);render();toast('Доступ отозван · симуляция')}
 else if(action==='close-modal')closeDialog();else if(action==='autostart'){state.start=!state.start;render();toast('Настройка автозапуска изменена · демо')}
 else if(action==='lan'){state.lan=!state.lan;render();toast('LAN '+(state.lan?'включён':'выключен')+' · демо')}
 else if(action==='startup'){state.startup[Number(id)].enabled=!state.startup[Number(id)].enabled;render();toast('Конфигурация изменена, backup сохранён · симуляция')}
 else if(action==='discord-key')toast('Mute keybind отправлен · симуляция. Состояние Discord неизвестно.');
 else if(action==='rescan'){target.disabled=true;target.innerHTML=icon('restart')+' Сканирование · демо';setTimeout(()=>{if(state.page==='apps')render();toast('Каталог проверен · симуляция')},650)}
 else if(action==='add-app')dialog('<h2>Своё приложение</h2><p>Добавление на ПК. Здесь задаётся только название demo-приложения; реальные пути не исполняются.</p><input class="field" id="custom-name" placeholder="Название приложения" aria-label="Название своего приложения" style="margin-top:17px" maxlength="60"><div class="dialog-actions">'+btn('Отмена','close-modal')+btn('Добавить · демо','custom-save','','primary')+'</div>');
 else if(action==='custom-save'){const name=document.querySelector('#custom-name').value.trim();if(!name){toast('Введи название');return}state.apps.push({id:'custom'+Date.now(),name,kind:'apps',detail:'Своё приложение · демо',custom:true,favorite:false,running:false,volume:50,muted:false});closeDialog();render();toast('Приложение добавлено в demo-каталог')}
 else if(action==='remote-toggle'){state.remoteAllowed=!state.remoteAllowed;render()}
 else if(action==='refresh'){const el=document.querySelector('#remote-status');if(el)el.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')+' · демо';toast('Предпросмотр обновлён · симуляция')}
 else if(action==='keyboard')document.querySelector('#remote-input').focus();else if(action==='send-keys'){if(!state.remoteAllowed){toast('Удалённый ввод выключен');return}const el=document.querySelector('#remote-input');if(!el.value.trim()){toast('Введи текст');return}el.value='';toast('Текст отправлен · симуляция')}
 else if(action==='remote-click'){toast(state.remoteAllowed?'Ввод «'+id+'» · симуляция':'Удалённый ввод выключен')}
 else if(action==='fullscreen'){const el=document.querySelector('#remote-screen');if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Fullscreen недоступен'));else toast('Fullscreen недоступен в этом браузере')}
 else if(action==='files')document.querySelector('#file-input').click();else if(action==='cancel-file'){const f=state.queue.find(f=>String(f.id)===id);f.status='cancelled';updateTransfers()}
 else if(action==='retry-file'){const f=state.queue.find(f=>String(f.id)===id);f.status='uploading';startTransfer(f);updateTransfers()}
 else if(action==='clipboard'){const el=document.querySelector('#clipboard');toast(el.value.trim()?'Текст отправлен · симуляция':'Введи текст или ссылку')}
 else if(action==='clipboard-read'){document.querySelector('#clipboard').value='Пример текста с компьютера · симуляция';toast('Демонстрационный текст получен')}
 else if(action==='send-phone')dialog('<h2>Временная передача</h2><p>Пример: document.pdf → paired iPhone.<br>Ссылка будет device-bound и ограничена по времени.</p><div class="notice" style="margin-top:18px">В этом prototype ссылка и загрузка не создаются.</div><div class="dialog-actions">'+btn('Понятно','close-modal','','primary')+'</div>');
 else if(action==='folder')toast('Выбор папки выполняется native диалогом в готовом приложении.');
 else if(action==='diagnostics')dialog('<h2>Диагностика · демо</h2><p>Backend не подключён. Проверки ниже — макет результатов.</p><div class="connection"><span>LAN listener</span><span>Не проверен</span></div><div class="connection"><span>Windows Firewall</span><span>Не проверен</span></div><div class="connection"><span>WebView2 Runtime</span><span>Не проверен</span></div><div class="dialog-actions">'+btn('Закрыть','close-modal','','primary')+'</div>');
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='app-search'){state.search=el.value;document.querySelector('#app-list').innerHTML=appRows()}if(el.dataset.volume){const id=el.dataset.volume,value=Number(el.value);el.style.setProperty('--progress',value+'%');document.querySelectorAll('[data-volume-label="'+id+'"]').forEach(n=>n.textContent=value+'%');if(id==='master')state.master=value;else if(id==='input')state.inputVolume=value;else if(id==='system')state.sounds.volume=value;else state.apps.find(a=>a.id===id).volume=value}});
document.addEventListener('change',event=>{if(event.target.matches('[data-device-select]'))toast('Устройство изменено в макете · демо');if(event.target.id==='file-input'){Array.from(event.target.files).forEach((file,i)=>{const f={id:Date.now()+i,name:file.name,size:file.size,progress:0,status:'uploading'};state.queue.push(f);startTransfer(f)});updateTransfers();toast('Добавлена demo-передача. Файлы не загружаются.')}});
function updateTransfers(){const el=document.querySelector('#transfer-list');if(el)el.innerHTML=transferRows()}
function startTransfer(f){clearInterval(f.timer);f.timer=setInterval(()=>{if(f.status!=='uploading'){clearInterval(f.timer);return}f.progress=Math.min(100,f.progress+7);if(f.progress===100){f.status='complete';clearInterval(f.timer)}updateTransfers()},250)}
document.addEventListener('click',event=>{const screen=event.target.closest('#remote-screen');if(!screen)return;if(!state.remoteAllowed){toast('Удалённый ввод выключен');return}const rect=screen.getBoundingClientRect();screen.querySelector('.remote-point')?.remove();const point=document.createElement('div');point.className='remote-point';point.style.left=(event.clientX-rect.left)+'px';point.style.top=(event.clientY-rect.top)+'px';screen.append(point);toast('Клик на экране · симуляция')});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDialog();const overlay=document.querySelector('.overlay');if(overlay&&event.key==='Tab'){const focusable=Array.from(overlay.querySelectorAll('button,input,textarea,select,[tabindex]')).filter(n=>!n.disabled);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}if(event.key==='Enter'&&document.activeElement?.id==='remote-screen'){toast(state.remoteAllowed?'Клик на экране · симуляция':'Удалённый ввод выключен')}});
document.addEventListener('pointerdown',event=>{if(event.target.id==='touchpad')toast(state.remoteAllowed?'Тачпад · симуляция ввода':'Удалённый ввод выключен')});
const themeQuery=matchMedia('(prefers-color-scheme: light)');themeQuery.addEventListener?.('change',()=>{if(state.theme==='system')setTheme()});render();
</script>
</body></html>
