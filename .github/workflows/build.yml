name: Windows build and prerelease
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LocalControl.Web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build and API/security checks
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Browser contract checks
        working-directory: src/LocalControl.Web
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Browser checks failed' }
      - name: Native adapter startup check
        shell: pwsh
        run: |
          $check = Start-Process ./artifacts/win-x64/LocalControl.exe -ArgumentList '--health-check' -PassThru
          if (-not $check.WaitForExit(30000)) { $check.Kill(); throw 'Native startup check timed out' }
          if ($check.ExitCode -ne 0) { throw 'Native startup check failed' }
      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: LocalControl-0.3.0-dev-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    # Initial publication is explicitly requested by the owner. Fork PRs cannot publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/0.3.0-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalControl-0.3.0-dev-win-x64
          path: packages
      - name: Publish verified build packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum --check *.sha256
          test -s LocalControl-0.3.0-dev-Setup.exe
          cat > release-notes.md <<'NOTES'
          Первая Windows-сборка LocalControl. Скачать установщик: LocalControl-0.3.0-dev-Setup.exe.

          Portable ZIP запускается после распаковки всей папки; .NET включён. Для интерфейса требуется WebView2.

          Перед публикацией выполнены .NET build, Core/API tests и браузерные проверки. Это предварительный выпуск: реальные Core Audio, установка/удаление и подключение iPhone ещё требуют проверки на Windows 11.

          Репозиторий содержит исходники. Версия не объявляется stable. Автоматический канал обновлений не включён.
          NOTES
          gh release create v0.3.0-dev --target "$SOURCE_SHA" --title "LocalControl 0.3.0-dev" --prerelease --notes-file release-notes.md LocalControl-0.3.0-dev-Setup.exe LocalControl-0.3.0-dev-Setup.exe.sha256 LocalControl-0.3.0-dev-win-x64.zip LocalControl-0.3.0-dev-win-x64.zip.sha256
